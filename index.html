<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>情報科指導法I（修正版）</title>
  <style>
    :root{
      --bg:#f9f9f9; --card:#fff; --primary:#0078d7; --primary-dark:#005a9e;
      --text:#222; --muted:#666;
    }
    html, body {
      height:100%; margin:0; padding:0;
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    }
    body { padding:12px; font-size:18px; line-height:1.6; }
    header { max-width:900px; margin:0 auto; }
    h1 { font-size:1.6rem; text-align:center; margin:8px 0 12px; }
    .container { max-width:900px; margin:0 auto; }
    .card { background:var(--card); border-radius:10px; padding:12px; box-shadow:0 1px 2px rgba(0,0,0,0.04); margin-bottom:12px; }
    .tag-btn { display:block; width:100%; text-align:center; padding:14px; margin:8px 0; border-radius:8px; border:1px solid #ddd; background:transparent; font-size:1.05rem; }
    .tag-btn:active { transform:translateY(1px); }
    #quiz { display:none; }
    #question { font-size:1.15rem; margin:6px 0 10px; }
    #options { list-style:none; padding:0; margin:0; }
    #options li { margin-bottom:8px; }
    #options button { width:100%; padding:14px; border-radius:8px; border:1px solid #ddd; background:var(--card); text-align:left; font-size:1.03rem; }
    #options button[disabled]{ opacity:0.75; }
    #options button.correct{ background:#e6ffea; border-color:#b8efc3; }
    #options button.wrong{ background:#ffecec; border-color:#f3b3b3; }
    #progress { font-size:0.95rem; color:var(--muted); text-align:center; margin:10px 0; }
    #nextBtn { display:none; width:100%; background:var(--primary); color:#fff; border:none; padding:12px; border-radius:8px; font-size:1.05rem; }
    #nextBtn:active { background:var(--primary-dark); }
    #result { display:none; }
    p.explain { color:var(--muted); margin:8px 0 0; font-size:0.97rem; }
    .small { font-size:0.9rem; color:var(--muted); }
    @media(min-width:720px){
      body{padding:20px;}
      h1{font-size:1.9rem;}
      .tag-btn{max-width:480px;margin:0 auto;}
    }
  </style>
</head>
<body>
  <header>
    <h1 id="mainTitle">情報科指導法I</h1>
  </header>

  <main class="container">
    <div id="controls" class="card">
      <button class="tag-btn" data-tag="info01">01.情報とその特性</button>
      <button class="tag-btn" data-tag="info02">02.メディアとその特性</button>
      <button class="tag-btn" data-tag="info03">03.問題を解決する方法</button>
      <button class="tag-btn" data-tag="info04">04.情報の収集と分析</button>
      <button class="tag-btn" data-tag="info05">05.解決方法の考察</button>
    </div>

    <div id="quiz" class="card" aria-live="polite">
      <div id="question"></div>
      <ul id="options"></ul>
      <div id="progress"></div>
      <button id="nextBtn">次へ ▶</button>
    </div>

    <div id="result" class="card"></div>
  </main>

  <script>
    const QUESTIONS_PER_SUBJECT = 3;
    const CSV_MAP = {
      info01: 'info01.csv',
      info02: 'info02.csv',
      info03: 'info03.csv',
      info04: 'info04.csv',
      info05: 'info05.csv'
    };

    let questions = [], current = 0, score = 0, currentTag = '';

    const controlsEl = document.getElementById('controls');
    const quizEl = document.getElementById('quiz');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const progressEl = document.getElementById('progress');
    const nextBtn = document.getElementById('nextBtn');
    const resultEl = document.getElementById('result');
    const mainTitle = document.getElementById('mainTitle');

    document.querySelectorAll('.tag-btn').forEach(btn => {
      btn.addEventListener('click', () => startQuiz(btn.dataset.tag));
    });

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function shuffleOptions(q) {
      const mapped = q.options.map((opt, idx) => ({ opt, idx }));
      shuffle(mapped);
      q.options = mapped.map(m => m.opt);
      q.answer = mapped.findIndex(m => m.idx === q.answer);
      return q;
    }

    // 引用対応の簡易CSVパーサ（ダブルクォートとカンマを処理）
    function parseCSVLine(line){
      const out = [];
      let cur = '', inQ = false;
      for(let i=0;i<line.length;i++){
        const ch = line[i];
        if(inQ){
          if(ch === '"'){
            if(line[i+1] === '"'){ cur += '"'; i++; } // エスケープされた引用
            else { inQ = false; }
          }else{
            cur += ch;
          }
        }else{
          if(ch === '"'){ inQ = true; }
          else if(ch === ','){ out.push(cur.trim()); cur = ''; }
          else { cur += ch; }
        }
      }
      out.push(cur.trim());
      return out;
    }

    async function loadCSV(file) {
      const res = await fetch(file);
      if (!res.ok) return [];
      let text = await res.text();
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (lines.length <= 1) return [];
      const rows = lines.slice(1).map(line => {
        const c = parseCSVLine(line);
        if (c.length < 7) return null;
        const opts = [c[2]||'', c[3]||'', c[4]||'', c[5]||''].map(s => s.trim());
        let ans = parseInt((c[6]||'1').trim(), 10);
        if (isNaN(ans) || ans < 1 || ans > 4) ans = 1;
        return {
          q: (c[1]||'').trim() || '（問題文がありません）',
          options: opts,
          answer: ans - 1,
          explanation: (c[7]||'').trim()
        };
      }).filter(Boolean);
      return rows;
    }

    function dedupeByQuestion(arr){
      const seen = new Set();
      const out = [];
      for(const item of arr){
        const key = item.q;
        if(!seen.has(key)){
          seen.add(key);
          out.push(item);
        }
      }
      return out;
    }

    async function startQuiz(tag) {
      currentTag = tag;
      controlsEl.style.display = 'none';
      quizEl.style.display = 'none';
      resultEl.style.display = 'none';
      mainTitle.style.display = 'none';

      const pool = await loadCSV(CSV_MAP[tag]);
      const unique = dedupeByQuestion(pool);
      const take = Math.min(QUESTIONS_PER_SUBJECT, unique.length);
      if (take === 0) {
        // プールが空なら何もせず復帰
        controlsEl.style.display = '';
        mainTitle.style.display = '';
        return;
      }
      questions = shuffle(unique).slice(0, take).map(shuffleOptions);
      current = 0;
      score = 0;
      quizEl.style.display = '';
      showQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showQuestion() {
      const q = questions[current];
      if (!q) { showResults(); return; }
      questionEl.textContent = q.q;
      optionsEl.innerHTML = '';
      q.options.forEach((opt, i) => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.innerHTML = opt || '（選択肢がありません）';
        btn.addEventListener('click', () => selectAnswer(i));
        li.appendChild(btn);
        optionsEl.appendChild(li);
      });
      progressEl.textContent = `${current + 1}/${questions.length}`;
      nextBtn.style.display = 'none';
    }

    function selectAnswer(idx) {
      const q = questions[current];
      const btns = Array.from(optionsEl.querySelectorAll('button'));
      btns.forEach((b, i) => {
        b.disabled = true;
        b.classList.remove('correct', 'wrong');
        if (i === q.answer) b.classList.add('correct');
        if (i === idx && i !== q.answer) b.classList.add('wrong');
      });

      const msg = document.createElement('p');
      msg.innerHTML = idx === q.answer
        ? '<span style="color:green">🟢 正解！</span>'
        : `<span style="color:red">❌ 不正解</span><br>
           <span style="color:var(--muted)">正解: ${q.options[q.answer]}</span>`;
      msg.className = 'explain';

      const exp = document.createElement('p');
      exp.className = 'explain';
      exp.textContent = q.explanation ? '解説: ' + q.explanation : '';

      quizEl.appendChild(msg);
      if (exp.textContent) quizEl.appendChild(exp);
      if (idx === q.answer) score++;

      nextBtn.style.display = 'block';
      nextBtn.onclick = () => {
        msg.remove();
        exp.remove();
        nextBtn.style.display = 'none';
        current++;
        if (current < questions.length) {
          showQuestion();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          showResults();
        }
      };
    }

    function showResults() {
      quizEl.style.display = 'none';
      resultEl.innerHTML = `<h2>結果: ${score}/${questions.length}</h2>
        <p class="small">選択した科目: ${currentTag}</p>
        <p class="small">※ ページ左上のタイトルをタップして別科目を選択してください</p>`;
      resultEl.style.display = '';
      controlsEl.style.display = '';
      mainTitle.style.display = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
```
